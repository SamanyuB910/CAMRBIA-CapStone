[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlens"
version = "0.1.0"
description = "Replication of the R-lens (LRP-modified Jacobian lens) fitting harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "transformers>=5.5",
    "accelerate",
    "datasets",
    "huggingface_hub",
    "safetensors",
    "einops",
    "numpy",
    "pandas",
    "matplotlib",
    "pytest",
    "jupyter",
    "pyyaml",
    "jlens",
    "tabulate>=0.10.0",
]

[project.scripts]
rlens = "rlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rlens"]

[tool.uv]
package = true

[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens", rev = "581d398613e5602a5af361e1c34d3a92ea82ba8e" }
# PyPI's Linux torch bundles a CUDA newer than many GPU-box drivers (e.g. the
# A100 pod's 12.8). cu126 wheels run on any >=12.6 driver. Windows stays on
# the PyPI CPU wheel.
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
