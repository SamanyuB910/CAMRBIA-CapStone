[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rlens"
version = "0.1.0"
description = "Replication of the R-lens (LRP-modified Jacobian lens) fitting harness"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch==2.11.0",
    "transformers>=5.5",
    "accelerate",
    "datasets",
    "huggingface_hub",
    "safetensors",
    "einops",
    "numpy",
    "pandas",
    "matplotlib",
    "pytest",
    "jupyter",
    "pyyaml",
    "jlens",
    "tabulate>=0.10.0",
]

[project.scripts]
rlens = "rlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["rlens"]

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
jlens = { git = "https://github.com/anthropics/jacobian-lens", rev = "581d398613e5602a5af361e1c34d3a92ea82ba8e" }
# Same torch version everywhere; only the build differs. The cu128 index has no
# macOS wheels, so an unconditional source made `uv sync` fail outright on a Mac
# and took the CPU-only analysis layer (`rlens stats`, `rlens figures`) down with
# it. Non-darwin resolves the CUDA build from the pytorch index; darwin falls
# back to the default index, which ships torch 2.11.0 for arm64.
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
